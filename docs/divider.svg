<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C87D28" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C87D28"/>
      <stop offset="1" stop-color="#C87D28" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .bar { stroke: url(#g); stroke-width: 2; stroke-linecap: round; }
    .dot { fill: #144734; transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .4s; fill: #C87D28 } .d3 { animation-delay: .8s }
    @keyframes beat { 0%,100% { transform: scale(1); opacity: .55 } 50% { transform: scale(1.7); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
  </style>
  <line class="bar" x1="40" y1="12" x2="1160" y2="12"/>
  <circle class="dot d3" cx="574" cy="12" r="3.5"/>
  <circle class="dot d2" cx="600" cy="12" r="4.5"/>
  <circle class="dot"    cx="626" cy="12" r="3.5"/>
</svg>
